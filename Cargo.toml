[workspace]
members = [
    "crates/usbmux-proto",
    "crates/usbmux",
    "crates/usbmux-sim",
    "crates/lockdown",
    "crates/xpc-proto",
    "crates/remotexpc",
    "crates/rsd",
    "crates/tunnel",
    "crates/ios",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
authors  = ["Andreas Lüdeke"]
license  = "MIT"

[workspace.dependencies]
usbmux-proto = { path = "crates/usbmux-proto" }
usbmux       = { path = "crates/usbmux" }
usbmux-sim   = { path = "crates/usbmux-sim" }
lockdown     = { path = "crates/lockdown" }
xpc-proto    = { path = "crates/xpc-proto" }
remotexpc    = { path = "crates/remotexpc" }
rsd          = { path = "crates/rsd" }
tunnel       = { path = "crates/tunnel" }

plist        = "1"
serde        = { version = "1", features = ["derive"] }
serde_bytes  = "0.11"
serde_json   = "1"
thiserror    = "2"
anyhow       = "1"
clap         = { version = "4", features = ["derive"] }
comfy-table  = "7"
rustls           = { version = "0.23", features = ["tls12"] }
rustls-pemfile   = "2"
x25519-dalek     = { version = "2", features = ["static_secrets"] }
ed25519-dalek    = { version = "2", features = ["rand_core"] }
hkdf             = "0.12"
sha2             = "0.10"
chacha20poly1305 = "0.10"
srp              = "0.6"
rand             = "0.8"
smoltcp          = { version = "0.11", default-features = false, features = ["socket-tcp", "proto-ipv6", "medium-ip", "alloc"] }
