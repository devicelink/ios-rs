[package]
name    = "ios-rs"
version = "0.1.0"
edition = "2021"
authors = ["Andreas Lüdeke"]
license = "MIT"

[lib]
name = "ios_rs"
path = "src/lib.rs"

[[bin]]
name              = "ios"
path              = "src/bin/ios/main.rs"
required-features = ["cli"]

[features]
default  = ["tunnel", "cli"]
cli      = ["tunnel", "dep:clap", "dep:comfy-table", "dep:anyhow"]
sim      = []
lockdown = ["dep:rustls", "dep:rustls-pemfile"]
tunnel   = [
    "lockdown",
    "dep:smoltcp",
    "dep:x25519-dalek",
    "dep:ed25519-dalek",
    "dep:hkdf",
    "dep:sha2",
    "dep:chacha20poly1305",
    "dep:srp",
    "dep:rand",
    "dep:serde_json",
]

[dependencies]
plist        = "1"
serde        = { version = "1", features = ["derive"] }
serde_bytes  = "0.11"
serde_json   = { version = "1", optional = true }
thiserror    = "2"
anyhow       = { version = "1", optional = true }
clap         = { version = "4", features = ["derive"], optional = true }
comfy-table  = { version = "7", optional = true }

rustls           = { version = "0.23", features = ["tls12"], optional = true }
rustls-pemfile   = { version = "2", optional = true }

smoltcp          = { version = "0.11", default-features = false, features = ["socket-tcp", "proto-ipv6", "medium-ip", "alloc"], optional = true }
x25519-dalek     = { version = "2", features = ["static_secrets"], optional = true }
ed25519-dalek    = { version = "2", features = ["rand_core"], optional = true }
hkdf             = { version = "0.12", optional = true }
sha2             = { version = "0.10", optional = true }
chacha20poly1305 = { version = "0.10", optional = true }
srp              = { version = "0.6", optional = true }
rand             = { version = "0.8", optional = true }

[dev-dependencies]
anyhow = "1"
